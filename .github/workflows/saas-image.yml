name: saas-image

# Builds the tenant-facing SaaS app image and pushes it to the Nebius Registry.
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   NEBIUS_REGISTRY   - registry FQDN + repo, e.g. cr.eu-north1.nebius.cloud/<registry-id>
#   NEBIUS_SA_KEY_ID  - Nebius service-account access key id (SA needs registry.pusher)
#   NEBIUS_SA_SECRET  - the paired secret access key
# Auth uses --password-stdin so nothing is printed; GitHub masks secrets in logs.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "saas/**"
      - ".github/workflows/saas-image.yml"
  workflow_dispatch: {}

concurrency:
  group: saas-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and test the image
        run: |
          docker build -t sim2policy-saas:ci ./saas

      - name: Log in to Nebius Registry
        env:
          NEBIUS_REGISTRY: ${{ secrets.NEBIUS_REGISTRY }}
          NEBIUS_SA_KEY_ID: ${{ secrets.NEBIUS_SA_KEY_ID }}
          NEBIUS_SA_SECRET: ${{ secrets.NEBIUS_SA_SECRET }}
        run: |
          registry_host="${NEBIUS_REGISTRY%%/*}"
          echo "$NEBIUS_SA_SECRET" | docker login "$registry_host" \
            --username "$NEBIUS_SA_KEY_ID" --password-stdin

      - name: Tag and push (commit SHA + moving tag)
        env:
          NEBIUS_REGISTRY: ${{ secrets.NEBIUS_REGISTRY }}
        run: |
          sha_tag="${GITHUB_SHA::12}"
          moving_tag="${GITHUB_REF_NAME}"
          docker tag sim2policy-saas:ci "$NEBIUS_REGISTRY/sim2policy-saas:$sha_tag"
          docker tag sim2policy-saas:ci "$NEBIUS_REGISTRY/sim2policy-saas:$moving_tag"
          docker push "$NEBIUS_REGISTRY/sim2policy-saas:$sha_tag"
          docker push "$NEBIUS_REGISTRY/sim2policy-saas:$moving_tag"
          echo "Pushed $NEBIUS_REGISTRY/sim2policy-saas:$sha_tag"

      # Optional GitOps bump: point the kustomization at the new immutable SHA tag and commit,
      # so ArgoCD deploys this exact build. Requires contents:write and a checkout of main.
      # - name: Bump GitOps image tag
      #   run: |
      #     cd deploy/manifests/saas
      #     kustomize edit set image sim2policy-saas=${NEBIUS_REGISTRY}/sim2policy-saas:${GITHUB_SHA::12}
