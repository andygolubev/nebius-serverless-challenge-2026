name: training-runtime-images

on:
  push:
    branches: [main]
    paths:
      - "sim2policy/**"
      - ".github/workflows/training-runtime-images.yml"
  pull_request:
    paths:
      - "sim2policy/**"
      - ".github/workflows/training-runtime-images.yml"
  workflow_dispatch: {}

concurrency:
  group: training-runtime-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.5"
          enable-cache: true
          cache-dependency-glob: sim2policy/uv.lock

      - name: Install headless MuJoCo libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libosmesa6

      - name: Run runtime, schema, security, and bundle gates
        working-directory: sim2policy
        env:
          MUJOCO_GL: osmesa
        run: |
          uv sync --frozen --extra api --extra sb3 --extra dev
          uv run ruff check src tests
          uv run mypy
          uv run pytest

  build-validate-push:
    needs: runtime-quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: sb3
            import_gate: >-
              import gymnasium, mujoco, sim2policy, stable_baselines3;
              print("sb3 runtime imports: ok")
          - target: mjx
            import_gate: >-
              import jax, mujoco, mujoco_playground, brax, sim2policy;
              print("mjx runtime imports: ok")
    steps:
      - uses: actions/checkout@v4

      # The runtime images are large; the default runner disk fills up while
      # buildx exports the tarball into the docker store ("no space left on
      # device"). Drop the preinstalled toolchains we never use (~30 GiB).
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.target }} runtime
        uses: docker/build-push-action@v6
        with:
          context: ./sim2policy
          file: ./sim2policy/Dockerfile
          target: ${{ matrix.target }}
          load: true
          push: false
          tags: sim2policy:${{ matrix.target }}-ci
          build-args: SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}-runtime
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-runtime

      - name: Validate runtime imports
        run: |
          docker run --rm --entrypoint python "sim2policy:${{ matrix.target }}-ci" -c \
            '${{ matrix.import_gate }}'

      - name: Validate SB3 gallery and custom robot container matrices
        if: matrix.target == 'sb3'
        run: |
          docker run --rm -e MUJOCO_GL=osmesa --entrypoint python \
            "sim2policy:${{ matrix.target }}-ci" \
            /app/scripts/smoke_gallery_container.py --backend sb3
          docker run --rm --entrypoint python "sim2policy:${{ matrix.target }}-ci" \
            -m sim2policy.custom_robot_job --help
          docker run --rm \
            -v "$PWD/saas/samples/robots:/samples:ro" \
            -v "$PWD/sim2policy/scripts:/smoke:ro" \
            --entrypoint python "sim2policy:${{ matrix.target }}-ci" \
            /smoke/smoke_custom_robot_container.py

      - name: Validate MJX gallery environment matrix
        if: matrix.target == 'mjx'
        run: |
          docker run --rm --entrypoint python "sim2policy:${{ matrix.target }}-ci" \
            /app/scripts/smoke_gallery_container.py --backend mjx

      - name: Log in to Nebius Registry
        if: github.event_name != 'pull_request'
        env:
          NEBIUS_REGISTRY: ${{ secrets.NEBIUS_REGISTRY }}
          NEBIUS_REGISTRY_TOKEN: ${{ secrets.NEBIUS_REGISTRY_TOKEN }}
        run: |
          registry_host="${NEBIUS_REGISTRY%%/*}"
          echo "$NEBIUS_REGISTRY_TOKEN" | docker login "$registry_host" \
            --username iam --password-stdin

      - name: Push immutable image
        if: github.event_name != 'pull_request'
        env:
          NEBIUS_REGISTRY: ${{ secrets.NEBIUS_REGISTRY }}
          TARGET: ${{ matrix.target }}
        run: |
          immutable_ref="$NEBIUS_REGISTRY/sim2policy:${TARGET}-${GITHUB_SHA}"
          docker tag "sim2policy:${TARGET}-ci" "$immutable_ref"
          docker push "$immutable_ref"

      - name: Update compatibility tag
        if: github.event_name != 'pull_request'
        env:
          NEBIUS_REGISTRY: ${{ secrets.NEBIUS_REGISTRY }}
          TARGET: ${{ matrix.target }}
        run: |
          immutable_ref="$NEBIUS_REGISTRY/sim2policy:${TARGET}-${GITHUB_SHA}"
          compatibility_ref="$NEBIUS_REGISTRY/sim2policy:${TARGET}-runtime"
          docker tag "sim2policy:${TARGET}-ci" "$compatibility_ref"
          docker push "$compatibility_ref"
          digest="$(docker buildx imagetools inspect "$immutable_ref" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          {
            echo "### ${TARGET} runtime published"
            echo "- Immutable: \`$immutable_ref\`"
            echo "- Compatibility: \`$compatibility_ref\`"
            echo "- Digest: \`$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Single job, after BOTH matrix legs, so the sb3 and mjx bumps cannot race each
  # other pushing to main. ArgoCD picks the commit up; the OpenTofu-written
  # secret is no longer the source of truth for these three values.
  bump-runtime-images:
    needs: build-validate-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump GitOps runtime images
        env:
          NEBIUS_REGISTRY: ${{ secrets.NEBIUS_REGISTRY }}
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "main advanced after this build started; the newer run owns the runtime bump"
            exit 0
          fi
          git checkout main

          env_file=deploy/manifests/saas/runtime-images.env
          sb3_ref="$NEBIUS_REGISTRY/sim2policy:sb3-${GITHUB_SHA}"
          mjx_ref="$NEBIUS_REGISTRY/sim2policy:mjx-${GITHUB_SHA}"

          # Rewrite values in place; the leading comment block is left untouched.
          sed -i \
            -e "s|^SIM2POLICY_JOB_IMAGE=.*|SIM2POLICY_JOB_IMAGE=${sb3_ref}|" \
            -e "s|^CUSTOM_ROBOT_SB3_IMAGE=.*|CUSTOM_ROBOT_SB3_IMAGE=${sb3_ref}|" \
            -e "s|^SIM2POLICY_MJX_JOB_IMAGE=.*|SIM2POLICY_MJX_JOB_IMAGE=${mjx_ref}|" \
            "$env_file"

          # Never push a reference the backend would reject at startup.
          bash deploy/tests/assert-saas-runtime-images.sh

          git add "$env_file"
          if git diff --cached --quiet; then
            echo "runtime images already point at ${GITHUB_SHA}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Deploy training runtimes ${GITHUB_SHA::12} [skip ci]"
          git push origin HEAD:main

          {
            echo "### GitOps runtime images bumped"
            echo "- SB3: \`$sb3_ref\`"
            echo "- MJX: \`$mjx_ref\`"
          } >> "$GITHUB_STEP_SUMMARY"
