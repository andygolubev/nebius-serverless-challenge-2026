apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: saas
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/andygolubev/nebius-serverless-challenge-2026.git
    targetRevision: main
    path: deploy/manifests/saas
  destination:
    server: https://kubernetes.default.svc
    namespace: saas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
