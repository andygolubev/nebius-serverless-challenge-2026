# Child Application managed by the root app-of-apps (see cloud-init root Application).
# Applies the Let's Encrypt ClusterIssuers from deploy/manifests/cert-manager. Runs after the
# cert-manager app (default sync-wave 0 vs -1); on a cold bootstrap the first sync can fail
# until the ClusterIssuer CRD exists, so automated sync retries until it converges.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-issuers
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/andygolubev/nebius-serverless-challenge-2026.git
    targetRevision: debug-portal
    path: deploy/manifests/cert-manager
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
