apiVersion: apps/v1
kind: Deployment
metadata:
  name: saas
  labels:
    app: saas
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: saas
  template:
    metadata:
      labels:
        app: saas
    spec:
      imagePullSecrets:
        - name: nebius-registry
      containers:
        - name: saas
          image: sim2policy-saas
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: SAAS_EMAIL_BACKEND
              value: smtp
            - name: SAAS_SESSION_TTL_HOURS
              value: "24"
            - name: SAAS_DB_PATH
              value: /data/saas.db
            - name: SAAS_ANALYTICS_IP_SALT
              valueFrom:
                secretKeyRef:
                  name: saas-nebius
                  key: SAAS_ANALYTICS_IP_SALT
            - name: CUSTOM_ROBOT_MAX_ACTIVE_PREPARATIONS
              value: "4"
            - name: CUSTOM_ROBOT_MAX_ACTIVE_TRAINING_JOBS
              value: "4"
            # Rolling 24-hour cap per tenant. 16 is one full four-cell matrix plus one
            # retry, which is under-sized for the measure-change-remeasure loop the
            # reward contract is tuned by: a single evening of bracketing a coefficient
            # spends it and then blocks for the rest of the window. At the measured
            # ~$0.08 per 3M-step CPU run, 40 bounds a tenant at roughly $3.20 a day.
            - name: CUSTOM_ROBOT_MAX_DAILY_STARTS
              value: "40"
            # Runtime job images come from Git (runtime-images.env), not from the
            # OpenTofu-written secret. Explicit env beats envFrom, so these win
            # over the stale keys still present in `saas-nebius`.
            - name: SIM2POLICY_JOB_IMAGE
              valueFrom:
                configMapKeyRef:
                  name: saas-runtime-images
                  key: SIM2POLICY_JOB_IMAGE
            - name: SIM2POLICY_MJX_JOB_IMAGE
              valueFrom:
                configMapKeyRef:
                  name: saas-runtime-images
                  key: SIM2POLICY_MJX_JOB_IMAGE
            - name: CUSTOM_ROBOT_SB3_IMAGE
              valueFrom:
                configMapKeyRef:
                  name: saas-runtime-images
                  key: CUSTOM_ROBOT_SB3_IMAGE
          envFrom:
            - secretRef:
                name: saas-nebius
                optional: true
            - secretRef:
                name: saas-smtp
                optional: false
          volumeMounts:
            - name: nebius-metadata
              mountPath: /var/run/secrets/nebius-metadata
              readOnly: true
            - name: saas-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: nebius-metadata
          hostPath:
            path: /mnt/cloud-metadata
            type: Directory
        - name: saas-data
          persistentVolumeClaim:
            claimName: saas-data
