apiVersion: apps/v1
kind: Deployment
metadata:
  name: saas
  labels:
    app: saas
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: saas
  template:
    metadata:
      labels:
        app: saas
    spec:
      imagePullSecrets:
        - name: nebius-registry
      containers:
        - name: saas
          image: sim2policy-saas
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: SAAS_EMAIL_BACKEND
              value: smtp
            - name: SAAS_SESSION_TTL_HOURS
              value: "24"
            - name: SAAS_DB_PATH
              value: /data/saas.db
            - name: SAAS_ANALYTICS_IP_SALT
              valueFrom:
                secretKeyRef:
                  name: saas-nebius
                  key: SAAS_ANALYTICS_IP_SALT
            - name: CUSTOM_ROBOT_MAX_ACTIVE_PREPARATIONS
              value: "4"
            - name: CUSTOM_ROBOT_MAX_ACTIVE_TRAINING_JOBS
              value: "4"
            - name: CUSTOM_ROBOT_MAX_DAILY_STARTS
              value: "16"
            - name: CUSTOM_ROBOT_SB3_IMAGE
              value: cr.eu-north1.nebius.cloud/e00gkhk5kcqp6fej6g/sim2policy:sb3-d905e49136ee1aad3b214574e394c1024521ebb6
          envFrom:
            - secretRef:
                name: saas-nebius
                optional: true
            - secretRef:
                name: saas-smtp
                optional: false
          volumeMounts:
            - name: nebius-metadata
              mountPath: /var/run/secrets/nebius-metadata
              readOnly: true
            - name: saas-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: nebius-metadata
          hostPath:
            path: /mnt/cloud-metadata
            type: Directory
        - name: saas-data
          persistentVolumeClaim:
            claimName: saas-data
