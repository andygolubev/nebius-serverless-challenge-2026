apiVersion: apps/v1
kind: Deployment
metadata:
  name: saas
  labels:
    app: saas
spec:
  # Sessions and auth rate limits live in-process; keep a single replica until a shared store exists.
  replicas: 1
  selector:
    matchLabels:
      app: saas
  template:
    metadata:
      labels:
        app: saas
    spec:
      imagePullSecrets:
        - name: nebius-registry
      containers:
        - name: saas
          image: sim2policy-saas # replaced by kustomize images: mapping
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            # mock logs login codes to stdout (demo only); switch to smtp and create the
            # saas-smtp secret (SAAS_SMTP_HOST/PORT/USER/PASSWORD/FROM) for real email.
            - name: SAAS_EMAIL_BACKEND
              value: mock
            - name: SAAS_SESSION_TTL_HOURS
              value: "24"
          # SAAS_ORCHESTRATION_BACKEND intentionally has no explicit `env` entry
          # (explicit env would override envFrom): the whole nebius orchestration
          # contract — SAAS_ORCHESTRATION_BACKEND=nebius, NEBIUS_*, AWS_*,
          # SIM2POLICY_* — comes from the `saas-nebius` Secret, created
          # out-of-band from MysteryBox values (see sim2policy/infra/nebius/
          # README.md). Without the secret the app falls back to its built-in
          # default backend (mock), so this manifest syncs safely in any order
          # and no credentials live in Git.
          envFrom:
            - secretRef:
                name: saas-nebius
                optional: true
            # Uncomment together with SAAS_EMAIL_BACKEND=smtp:
            # - secretRef:
            #     name: saas-smtp
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
