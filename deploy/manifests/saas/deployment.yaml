apiVersion: apps/v1
kind: Deployment
metadata:
  name: saas
  labels:
    app: saas
spec:
  # Durable state is SQLite on a ReadWriteOnce PVC: single replica, and Recreate so the
  # old pod releases the volume before the new one starts (rolling update would deadlock).
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: saas
  template:
    metadata:
      labels:
        app: saas
    spec:
      imagePullSecrets:
        - name: nebius-registry
      containers:
        - name: saas
          image: sim2policy-saas # replaced by kustomize images: mapping
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            # Production must use the non-optional saas-smtp Secret below. Local and
            # test processes retain the application's explicit mock default.
            - name: SAAS_EMAIL_BACKEND
              value: smtp
            - name: SAAS_SESSION_TTL_HOURS
              value: "24"
            - name: SAAS_DB_PATH
              value: /data/saas.db
          # SAAS_ORCHESTRATION_BACKEND intentionally has no explicit `env` entry
          # (explicit env would override envFrom): the whole nebius orchestration
          # contract — SAAS_ORCHESTRATION_BACKEND=nebius, NEBIUS_*, AWS_*,
          # SIM2POLICY_* — comes from the `saas-nebius` Secret, created
          # out-of-band from MysteryBox values (see sim2policy/infra/nebius/
          # README.md). Without the secret the app falls back to its built-in
          # default backend (mock), so this manifest syncs safely in any order
          # and no credentials live in Git.
          envFrom:
            - secretRef:
                name: saas-nebius
                optional: true
            - secretRef:
                name: saas-smtp
                optional: false
          volumeMounts:
            - name: nebius-iam-token
              mountPath: /var/run/secrets/nebius/iam-token
              readOnly: true
            - name: saas-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: nebius-iam-token
          hostPath:
            path: /mnt/cloud-metadata/token
            type: File
        - name: saas-data
          persistentVolumeClaim:
            claimName: saas-data
