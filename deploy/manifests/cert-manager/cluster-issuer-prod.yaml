# Production Let's Encrypt issuer. HTTP-01 challenges are solved through the built-in k3s
# Traefik ingress on port 80 (already open in the saas-server firewall).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: andygolubevremit@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
