AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Sim2Policy one-stack AWS GPU debug environment: public VPC, SSH security group,
  generated EC2 key pair, g6.2xlarge DLAMI instance, debug S3 bucket, and instance role.

Parameters:
  ProjectName:
    Type: String
    Default: sim2policy
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9-]{2,24}$"
    Description: Short name used in resource names and tags.

  InstanceType:
    Type: String
    Default: g6.2xlarge
    AllowedValues:
      - g6.2xlarge
      - g6.xlarge
      - g6.4xlarge
      - g5.xlarge
      - g5.2xlarge
      - g5.4xlarge
    Description: GPU instance type for CUDA/MuJoCo debugging.

  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/deeplearning/ami/x86_64/oss-nvidia-driver-gpu-pytorch-2.12-ubuntu-24.04/latest/ami-id
    Description: Deep Learning AMI SSM parameter or explicit AMI ID.

  SSHLocation:
    Type: String
    AllowedPattern: "^(([0-9]{1,3}\\.){3}[0-9]{1,3}/[0-9]{1,2}|[0-9a-fA-F:]+/[0-9]{1,3})$"
    ConstraintDescription: Must be an IPv4 or IPv6 CIDR block, e.g. 203.0.113.10/32.
    Description: CIDR allowed to SSH into the debug VM. Prefer your current public IP /32.

  RootVolumeGiB:
    Type: Number
    Default: 240
    MinValue: 80
    MaxValue: 1000
    Description: Root EBS gp3 volume size.

  VpcCidr:
    Type: String
    Default: 10.42.0.0/16
    Description: CIDR for the debug VPC.

  PublicSubnetCidr:
    Type: String
    Default: 10.42.1.0/24
    Description: CIDR for the public debug subnet.

  TerminateOnShutdown:
    Type: String
    Default: stop
    AllowedValues:
      - stop
      - terminate
    Description: EC2 instance-initiated shutdown behavior.

Resources:
  DebugVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-debug-vpc"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Purpose
          Value: sim2policy-debug

  DebugInternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-debug-igw"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Purpose
          Value: sim2policy-debug

  DebugGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref DebugInternetGateway
      VpcId: !Ref DebugVpc

  DebugPublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Ref PublicSubnetCidr
      MapPublicIpOnLaunch: true
      VpcId: !Ref DebugVpc
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-debug-public"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Purpose
          Value: sim2policy-debug

  DebugRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref DebugVpc
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-debug-public-rt"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Purpose
          Value: sim2policy-debug

  DebugDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: DebugGatewayAttachment
    Properties:
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref DebugInternetGateway
      RouteTableId: !Ref DebugRouteTable

  DebugSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref DebugRouteTable
      SubnetId: !Ref DebugPublicSubnet

  DebugSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SSH access for Sim2Policy debug VM
      VpcId: !Ref DebugVpc
      SecurityGroupIngress:
        - Description: SSH from operator CIDR
          IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SSHLocation
      SecurityGroupEgress:
        - Description: Allow outbound package, container, and object-store traffic
          IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-debug-ssh"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Purpose
          Value: sim2policy-debug

  DebugKeyPair:
    Type: AWS::EC2::KeyPair
    Properties:
      KeyName: !Sub "${ProjectName}-${AWS::StackName}-key"
      KeyType: ed25519
      KeyFormat: pem
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${AWS::StackName}-key"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Purpose
          Value: sim2policy-debug

  DebugArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-debug-artifacts
            Status: Enabled
            ExpirationInDays: 14
          - Id: abort-incomplete-mpu
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Purpose
          Value: sim2policy-debug

  DebugInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: sim2policy-debug-artifacts
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !GetAtt DebugArtifactBucket.Arn
              - Effect: Allow
                Action:
                  - s3:AbortMultipartUpload
                  - s3:DeleteObject
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub "${DebugArtifactBucket.Arn}/*"
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Purpose
          Value: sim2policy-debug

  DebugInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref DebugInstanceRole

  DebugElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-debug-eip"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Purpose
          Value: sim2policy-debug

  DebugInstance:
    Type: AWS::EC2::Instance
    Properties:
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            DeleteOnTermination: true
            Encrypted: true
            VolumeSize: !Ref RootVolumeGiB
            VolumeType: gp3
      IamInstanceProfile: !Ref DebugInstanceProfile
      ImageId: !Ref AmiId
      InstanceInitiatedShutdownBehavior: !Ref TerminateOnShutdown
      InstanceType: !Ref InstanceType
      KeyName: !Ref DebugKeyPair
      SecurityGroupIds:
        - !Ref DebugSecurityGroup
      SubnetId: !Ref DebugPublicSubnet
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-debug-${InstanceType}"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Purpose
          Value: sim2policy-debug
      UserData:
        Fn::Base64: !Sub |
          #!/usr/bin/env bash
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive

          apt-get update
          apt-get install -y \
            build-essential \
            ca-certificates \
            curl \
            ffmpeg \
            git \
            gnupg \
            htop \
            jq \
            libgl1 \
            libglfw3 \
            libosmesa6 \
            libosmesa6-dev \
            nvtop \
            pkg-config \
            tmux \
            unzip

          if ! command -v docker >/dev/null 2>&1; then
            apt-get install -y docker.io
          fi
          systemctl enable --now docker || true
          usermod -aG docker ubuntu || true

          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey \
            | gpg --dearmor -o /etc/apt/keyrings/nvidia-container-toolkit-keyring.gpg
          curl -fsSL https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list \
            | sed 's#deb https://#deb [signed-by=/etc/apt/keyrings/nvidia-container-toolkit-keyring.gpg] https://#g' \
            > /etc/apt/sources.list.d/nvidia-container-toolkit.list
          apt-get update
          apt-get install -y nvidia-container-toolkit
          nvidia-ctk runtime configure --runtime=docker || true
          systemctl restart docker || true

          if ! command -v uv >/dev/null 2>&1; then
            curl -LsSf https://astral.sh/uv/install.sh | env UV_INSTALL_DIR=/usr/local/bin sh
          fi

          cat >/etc/profile.d/sim2policy-debug.sh <<'PROFILE'
          export AWS_REGION='${AWS::Region}'
          export AWS_DEFAULT_REGION='${AWS::Region}'
          export SIM2POLICY_S3_BUCKET='${DebugArtifactBucket}'
          export SIM2POLICY_S3_PREFIX='sim2policy'
          export MUJOCO_GL='egl'
          export PYTHONUNBUFFERED='1'
          PROFILE

          mkdir -p /home/ubuntu/work /opt/sim2policy
          chown -R ubuntu:ubuntu /home/ubuntu/work
          nvidia-smi >/opt/sim2policy/nvidia-smi.txt 2>&1 || true
          docker --version >/opt/sim2policy/docker-version.txt 2>&1 || true
          uv --version >/opt/sim2policy/uv-version.txt 2>&1 || true
          date -u +%FT%TZ >/opt/sim2policy/cloud-init-ready

  DebugEipAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt DebugElasticIp.AllocationId
      InstanceId: !Ref DebugInstance

Outputs:
  InstanceId:
    Description: EC2 instance ID.
    Value: !Ref DebugInstance

  InstancePublicIp:
    Description: Elastic public IP for SSH.
    Value: !Ref DebugElasticIp

  InstancePublicDnsName:
    Description: Public DNS name of the EC2 instance.
    Value: !GetAtt DebugInstance.PublicDnsName

  SshUser:
    Description: SSH username for the Ubuntu Deep Learning AMI.
    Value: ubuntu

  SshCommand:
    Description: SSH command after retrieving the private key to /tmp.
    Value: !Sub "ssh -i /tmp/${AWS::StackName}.pem ubuntu@${DebugElasticIp}"

  KeyPairName:
    Description: Generated EC2 key pair name.
    Value: !Ref DebugKeyPair

  KeyPairId:
    Description: Generated EC2 key pair ID.
    Value: !GetAtt DebugKeyPair.KeyPairId

  PrivateKeySsmParameter:
    Description: SecureString parameter containing the generated private key.
    Value: !Sub
      - "/ec2/keypair/${KeyPairId}"
      - KeyPairId: !GetAtt DebugKeyPair.KeyPairId

  ArtifactBucketName:
    Description: S3 bucket for disposable Sim2Policy debug artifacts.
    Value: !Ref DebugArtifactBucket

  ArtifactPrefix:
    Description: Default object prefix exported on the VM.
    Value: sim2policy
