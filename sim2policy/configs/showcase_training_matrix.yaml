schema_version: 1
campaign:
  execution_location: nebius
  max_active_jobs: 1
  selection:
    seeds: [101, 151, 211, 271, 331]
    episodes_per_seed: 2
  final:
    seeds: [0, 1, 2, 3, 4]
    episodes_per_seed: 4
examples:
  reacher:
    gallery_example_id: reacher-target
    backend: sb3
    config: configs/reacher_sb3.yaml
    image: {runtime: sb3, tag_template: "sb3-{git_sha}"}
    seeds: [0, 7, 42]
    base_steps: 1000000
    extension_steps: 1500000
    checkpoint_every_steps: 100000
    hardware: {platform: cpu-d3, preset: 8vcpu-32gb, disk_gib: 100, timeout_minutes: 60, preemptible: false}
    acceptance: {hard: {mean_reward: -10}, preferred: {mean_reward: -7}}
    ranking: {kind: mean_reward, stability: mean_episode_length, tie_breaker: earlier_checkpoint}
  halfcheetah:
    gallery_example_id: halfcheetah-sprint
    backend: sb3
    config: configs/halfcheetah_gallery_sb3.yaml
    image: {runtime: sb3, tag_template: "sb3-{git_sha}"}
    seeds: [0, 7, 42]
    base_steps: 3000000
    extension_steps: 5000000
    checkpoint_every_steps: 250000
    hardware: {platform: cpu-d3, preset: 8vcpu-32gb, disk_gib: 100, timeout_minutes: 120, preemptible: false}
    acceptance: {hard: {mean_reward: 1500}, preferred: {mean_reward: 2000}}
    ranking: {kind: mean_reward, stability: mean_episode_length, tie_breaker: earlier_checkpoint}
  ant:
    gallery_example_id: ant-explorer
    backend: sb3
    config: configs/ant_gallery_sb3.yaml
    image: {runtime: sb3, tag_template: "sb3-{git_sha}"}
    seeds: [0, 7, 42]
    base_steps: 3000000
    extension_steps: 5000000
    checkpoint_every_steps: 250000
    hardware: {platform: cpu-d3, preset: 8vcpu-32gb, disk_gib: 100, timeout_minutes: 180, preemptible: false}
    acceptance: {hard: {mean_reward: 1000}, preferred: {mean_reward: 2500, mean_episode_length: 850}}
    ranking: {kind: mean_reward, stability: mean_episode_length, tie_breaker: earlier_checkpoint}
  hopper:
    gallery_example_id: hopper-balance
    backend: sb3
    config: configs/hopper_sb3.yaml
    image: {runtime: sb3, tag_template: "sb3-{git_sha}"}
    seeds: [0, 7, 42]
    base_steps: 5000000
    extension_steps: 8000000
    checkpoint_every_steps: 250000
    hardware: {platform: cpu-d3, preset: 8vcpu-32gb, disk_gib: 100, timeout_minutes: 180, preemptible: false}
    acceptance: {hard: {mean_reward: 1000}, preferred: {mean_reward: 1800, mean_episode_length: 500}}
    ranking: {kind: mean_reward, stability: mean_episode_length, tie_breaker: earlier_checkpoint}
  walker2d:
    gallery_example_id: walker2d-stride
    backend: sb3
    config: configs/walker2d_sb3.yaml
    image: {runtime: sb3, tag_template: "sb3-{git_sha}"}
    seeds: [0, 7, 42]
    base_steps: 5000000
    extension_steps: 8000000
    checkpoint_every_steps: 250000
    hardware: {platform: cpu-d3, preset: 8vcpu-32gb, disk_gib: 100, timeout_minutes: 180, preemptible: false}
    acceptance: {hard: {mean_reward: 1800}, preferred: {mean_reward: 3500, mean_episode_length: 1000}}
    ranking: {kind: mean_reward, stability: mean_episode_length, tie_breaker: earlier_checkpoint}
  go1:
    gallery_example_id: go1-walker
    backend: mjx
    config: configs/go1_mjx.yaml
    image: {runtime: mjx, tag_template: "mjx-{git_sha}"}
    seeds: [0, 7, 42]
    base_steps: 200000000
    extension_steps: 300000000
    checkpoint_every_steps: 10000000
    hardware: {platform: gpu-h100-sxm, preset: 1gpu-16vcpu-200gb, disk_gib: 100, timeout_minutes: 120, preemptible: false}
    acceptance: {hard: {episodes: 20, no_fall: true, min_velocity: 0.5}, preferred: {episodes: 20, no_fall: true, min_velocity: 0.75, mean_velocity: 0.9}}
    ranking: {kind: locomotion, fields: [no_fall_count, min_velocity, mean_episode_length, mean_velocity, mean_reward, earlier_checkpoint]}
  g1:
    gallery_example_id: g1-rough-terrain
    backend: mjx
    config: configs/g1_mjx.yaml
    image: {runtime: mjx, tag_template: "mjx-{git_sha}"}
    seeds: [0]
    base_steps: 450000000
    extension_steps: null
    checkpoint_every_steps: 25000000
    hardware: {platform: gpu-h100-sxm, preset: 1gpu-16vcpu-200gb, disk_gib: 100, timeout_minutes: 300, preemptible: false}
    curriculum:
      flat_config: configs/g1_flat_mjx.yaml
      rough_config: configs/g1_mjx.yaml
      flat_environment: G1JoystickFlatTerrain
      rough_environment: G1JoystickRoughTerrain
      flat_gates: [100000000, 150000000, 200000000]
      candidate_every_steps: 25000000
      pushes_enabled: false
    acceptance: {hard: {episodes: 20, no_fall: true, min_velocity: 0.4}, preferred: {episodes: 20, no_fall: true, min_velocity: 0.4, mean_velocity: 0.6}}
    ranking: {kind: locomotion, fields: [no_fall_count, min_velocity, mean_episode_length, mean_velocity, mean_reward, earlier_checkpoint]}
