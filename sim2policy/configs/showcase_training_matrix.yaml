        retries_allowed: 0
        extensions_allowed: false
        runtime_overrides_allowed: false
        superseded_sweep_run_id: sweep-g1-c1a522b-20260802-01
        superseded_sweep_job_id: aijob-e00c8fwyh15gy7qggk
        superseded_result_campaign_id: gallery-g1-direct-full-20260803-01
        superseded_result_job_id: aijob-e00pc60w55v89z6t5v
        pilot_required: false
      diagnostic:
        source_run_id: showcase-gallery-g1-20260801-16-g1-s0-flat
        source_environment: G1JoystickFlatTerrain
        environments: [G1ForwardFlatTerrain, G1ForwardRoughTerrain]
        episodes_per_seed: 4
        flat_required_horizons: 20
        min_velocity: 0.4
        ranking: [rough_horizon_count, rough_mean_episode_length, rough_min_velocity, rough_mean_velocity, rough_mean_reward, earlier_checkpoint]
      pilot:
        step_ceiling: 50000000
        effective_steps: 46202880
        timeout_minutes: 90
        seed: 0
        required_horizons: 5
        episodes: 10
        mean_episode_length: 900
        min_velocity: 0.4
        max_nan_terminations: 0
      full:
        total_step_ceiling: 450000000
        rough_effective_steps: 250511360
        timeout_minutes: 300
        seed: 0
        flat_gate_episodes: 10
        flat_required_horizons: 9
        flat_min_velocity: 0.4
        extension_steps: null
    # G1 measured ~0.80 reliability against an exact-count gate that passed 1.2%
    # of the time. With the survival reward targeting 0.95, 18/20 passes 93%.
    acceptance: {hard: {episodes: 20, required_horizons: 18, assumed_reliability: 0.95, min_velocity: 0.4}, preferred: {episodes: 20, required_horizons: 18, assumed_reliability: 0.95, min_velocity: 0.4, mean_velocity: 0.6}}
