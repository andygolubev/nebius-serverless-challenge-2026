backend: mjx
environment: G1ForwardFlatTerrain
seed: 0
training:
  total_steps: 150000000
  n_envs: 8192
  device: gpu
  hyperparameters:
    impl: jax
    playground_config_overrides:
      push_config.enable: false
      # Pinned G1 pays nothing to stay upright; T1, the other humanoid in the
      # same pinned package, ships 0.25. Walking still out-pays standing 3.8x.
      reward_config.scales.alive: 0.25
      # Campaign gallery-g1-survival-20260810-02 ran with alive 0.25 alone and
      # measured 8/10 horizons -- unchanged from the 0.80 baseline -- while
      # velocity improved to 0.91 m/s. Survival was the half that did not move,
      # so this completes T1's shape: it is the other scale T1 differs on, and
      # the single variable task 6.3 pre-registered as the next one to try.
      # Pinned G1's -100.0 is a one-off arriving at a 2 s lookahead (discounting
      # 0.99 at 50 Hz); T1 carries survival on `alive` and penalizes nothing.
      reward_config.scales.termination: 0.0
    num_eval_envs: 128
    num_evals: 20
    batch_size: 256
    num_minibatches: 32
    num_updates_per_batch: 4
    unroll_length: 20
    episode_length: 1000
    learning_rate: 0.0003
    entropy_cost: 0.005
    # 0.99 at 50 Hz gives a 2 s lookahead; 0.97 gave 0.67 s, too short to see a fall.
    discounting: 0.99
    reward_scaling: 1.0
    action_repeat: 1
    clipping_epsilon: 0.2
    max_grad_norm: 1.0
    policy_obs_key: state
    value_obs_key: privileged_state
    policy_hidden_layer_sizes: [512, 256, 128]
    value_hidden_layer_sizes: [512, 256, 128]
checkpoint: {every_steps: 25000000, keep: 20}
evaluation: {episodes: 20, seeds: [0, 1, 2, 3, 4]}
success: {kind: locomotion, min_velocity: 0.4, target_velocity: 1.0, require_not_fallen: true}
rendering: {frames: 500, fps: 30, width: 640, height: 480, seed: 0}
storage: {mode: local, prefix: sim2policy}
reporting:
  hourly_rate: 1.5484
  currency: USD
  rate_date: "2026-06-29"
