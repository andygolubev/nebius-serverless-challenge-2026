backend: sb3
environment: Reacher-v5
seed: 0
training:
  total_steps: 300000
  n_envs: 8
  device: cpu
  hyperparameters:
    batch_size: 256
    n_steps: 512
    n_epochs: 10
    gamma: 0.99
    gae_lambda: 0.95
    learning_rate: 0.0003
    ent_coef: 0.0
    clip_range: 0.2
checkpoint: {every_steps: 75000, keep: 3}
evaluation: {episodes: 20, seeds: [0, 1, 2, 3, 4]}
success: {kind: mean_reward, threshold: -10}
rendering: {frames: 300, fps: 30, width: 640, height: 480, seed: 0}
storage: {mode: local, prefix: sim2policy}
reporting: {hourly_rate: 0.1984, currency: USD, rate_date: '2026-07-14'}
