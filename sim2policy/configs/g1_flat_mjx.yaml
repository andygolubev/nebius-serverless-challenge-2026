backend: mjx
environment: G1JoystickFlatTerrain
seed: 0
training:
  total_steps: 200000000
  n_envs: 8192
  device: gpu
  hyperparameters:
    impl: jax
    playground_config_overrides:
      push_config.enable: false
    num_eval_envs: 128
    num_evals: 20
    batch_size: 256
    num_minibatches: 32
    num_updates_per_batch: 4
    unroll_length: 20
    episode_length: 1000
    learning_rate: 0.0003
    entropy_cost: 0.005
    discounting: 0.97
    reward_scaling: 1.0
    action_repeat: 1
    clipping_epsilon: 0.2
    max_grad_norm: 1.0
    policy_obs_key: state
    value_obs_key: privileged_state
    policy_hidden_layer_sizes: [512, 256, 128]
    value_hidden_layer_sizes: [512, 256, 128]
checkpoint: {every_steps: 25000000, keep: 20}
evaluation: {episodes: 20, seeds: [0, 1, 2, 3, 4]}
success: {kind: locomotion, min_velocity: 0.4, target_velocity: 1.0, require_not_fallen: true}
rendering: {frames: 500, fps: 30, width: 640, height: 480, seed: 0}
storage: {mode: local, prefix: sim2policy}
reporting:
  hourly_rate: 1.5484
  currency: USD
  rate_date: "2026-06-29"
